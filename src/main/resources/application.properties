spring.datasource.url=${NEON_DB_URL:jdbc:postgresql://ep-orange-forest-b67bzetn-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${NEON_DB_USERNAME:neondb_owner}
spring.datasource.password=${NEON_DB_PASSWORD}

spring.application.name=api
server.port=8083

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
